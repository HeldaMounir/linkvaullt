<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkVault | Notes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 nav-custom">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="#">
      <i class="bi bi-bookmark-heart-fill me-2"></i>LinkVault
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto ms-4">
        <li class="nav-item">
          <a class="nav-link" href="categories.html">
            <i class="bi bi-grid me-1"></i>Categories
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="bookmarks.html">
            <i class="bi bi-bookmark me-1"></i>Bookmarks
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="notes.html">
            <i class="bi bi-journal-text me-1"></i>Notes
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small" id="userEmail"></span>
        <button class="btn btn-outline-light btn-sm px-3">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="container">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div>
      <h2 class="fw-bold mb-1">My Notes</h2>
      <p class="text-muted mb-0">Write ideas, save thoughts, pin important notes</p>
    </div>

    <button class="btn-add-custom" data-bs-toggle="modal" data-bs-target="#noteModal">
      <i class="bi bi-plus-lg me-2"></i>Add Note
    </button>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 p-3">
        <small class="text-muted">Total Notes</small>
        <h4 class="fw-bold mb-0" id="totalNotes">0</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 p-3">
        <small class="text-muted">Pinned</small>
        <h4 class="fw-bold mb-0 text-warning" id="pinnedNotes">0</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0 rounded-4 p-3">
        <small class="text-muted">Recent</small>
        <h4 class="fw-bold mb-0 text-primary">Today</h4>
      </div>
    </div>
  </div>



  <div class="row g-4" id="notesGrid"></div>

  <div id="emptyNotes" class="empty-state d-none">
    <i class="bi bi-journal-x"></i>
    <h4 class="mt-3">No Notes Yet</h4>
    <p>Create your first note and start organizing your ideas</p>

    <button
      class="btn-add-custom mt-3"
      data-bs-toggle="modal"
      data-bs-target="#noteModal"
    >
      <i class="bi bi-plus-lg me-2"></i>Create Note
    </button>
  </div>

</div>

<div class="modal fade" id="noteModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow">

      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-journal-plus me-2 text-primary"></i>
          Add New Note
        </h5>

        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body p-4">
        <form id="noteForm">

          <input type="hidden" id="noteId">

          <div class="mb-3">
            <label class="form-label fw-semibold">Title</label>
            <input
              type="text"
              class="form-control rounded-4"
              id="noteTitle"
              placeholder="Enter note title..."
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Content</label>
            <textarea
              class="form-control rounded-4"
              id="noteContent"
              rows="5"
              placeholder="Write your note here..."
            ></textarea>
          </div>
          <div class="mb-3">
  <label class="form-label fw-semibold">Category Name</label>
<select id="noteCategoryId" class="form-control rounded-4" required>
  <option value="">Select Category</option>
</select></div>

          <button class="btn btn-primary w-100 rounded-4 py-3 fw-semibold">
            Save Note
          </button>

        </form>
      </div>

    </div>
  </div>
</div>
<div id="bookmarkNotesContainer" class="row g-3 mt-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="bookmark.js"></script>

</body>
</html>
