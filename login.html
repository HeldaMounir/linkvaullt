<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>..</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      
    <div class="card auth-card shadow-lg p-4 border-0">
      
      <ul class="nav nav-tabs border-0 mb-4 bg-light p-1 rounded-pill">
        <li class="nav-item w-50">
          <button class="nav-link active w-100 border-0 rounded-pill" data-bs-toggle="tab" data-bs-target="#loginTab">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </li>
        <li class="nav-item w-50">
          <button class="nav-link w-100 border-0 rounded-pill" data-bs-toggle="tab" data-bs-target="#registerTab">
            <i class="bi bi-person-plus me-2"></i>Register
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="loginTab">
          <h4 class="text-center mb-4 fw-bold">Welcome Back</h4>
          <form id="loginForm">
            <p id="error" style="color: red;"></p>
            <div class="mb-3 input-group-lg">
              <input type="email" class="form-control bg-light border-0" placeholder="Email address" id="emaillog" required>
            </div>
            <div class="mb-4 input-group-lg">
              <input type="password" class="form-control bg-light border-0" placeholder="Password" id="passlog" required>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Sign In</button>
          </form>
        </div>

        <div class="tab-pane fade" id="registerTab">
          <h4 class="text-center mb-4 fw-bold">Create Account</h4>
          <form id="registerForm">
            <div class="mb-3 input-group-lg">
              <input type="text" class="form-control bg-light border-0" placeholder="Full Name" id="regFirstName"  required >
            </div>
            <div class="mb-3 input-group-lg">
              <input type="text" class="form-control bg-light border-0" placeholder="Last Name" id="regLastName"  required >
            </div>
            <div class="mb-3 input-group-lg">
              <input type="email" class="form-control bg-light border-0" placeholder="Email address" id="regEmail"  required>
            </div>
            <div class="mb-4 input-group-lg">
              <input type="password" class="form-control bg-light border-0" placeholder="Password" id="regPassword" required>
            </div>
            <button class="btn btn-success w-100 py-2 fw-bold shadow-sm">Get Started</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
